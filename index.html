<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>러닝 코스 추천 - 지도</title>
<style>
  html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
  /* 카카오맵 저작권 표기는 SDK가 자동으로 지도 안에 넣어준다 — 따로 지울 수 없고, 지우면 이용 약관 위반이다 */
</style>
</head>
<body>
<div id="map"></div>

<!--
  이 페이지는 두 가지 모드로 쓰인다 (URL의 ?mode= 쿼리로 구분):
  - 기본(모드 없음): 출발 지점 선택 — 지도를 탭하거나 마커를 드래그해서 위치를 고른다.
  - ?mode=route: 코스 상세 화면에서 추천받은 실제 경로를 보여주기만 한다 (마커 드래그/탭 없음).

  React Native 앱 또는 웹 페이지(iframe) <-> 이 페이지 통신 프로토콜:

  [RN/웹 -> 이 페이지] postMessage로 JSON 문자열 전달:
    {"type": "SET_CENTER", "lat": 37.5665, "lng": 126.9780}
    받으면 지도 중심과 마커 위치를 그 좌표로 옮긴다 (최초 GPS 위치 전달용, 기본 모드에서만 씀).
    {"type": "DRAW_ROUTE", "coordinates": [[lng, lat, elevation], [lng, lat, elevation], ...]}
    받으면 그 좌표들을 이어 실제 경로를 그리고, 전체가 보이도록 지도를 맞춘다 (route 모드에서 씀).
    고도(elevation, 3번째 값)로 구간별 경사를 계산해서 오르막/평지/내리막을 다른 색으로 그린다.

  [이 페이지 -> RN/웹] postMessage로 JSON 문자열 전달:
    {"type": "LOCATION_SELECTED", "lat": ..., "lng": ...}
    지도를 탭하거나 마커를 드래그해서 위치를 확정할 때마다 보낸다 (기본 모드에서만).
    {"type": "READY"}
    카카오맵 SDK 로딩이 끝나고 지도가 뜬 직후 한 번 보낸다
    (RN/웹이 이 신호를 받은 뒤에 SET_CENTER나 DRAW_ROUTE를 보내야 안전하다).

  RN WebView에서는 window.ReactNativeWebView.postMessage로 보내고,
  일반 브라우저 iframe(웹 버전 앱)에서는 window.parent.postMessage로 보낸다 — 둘 다 지원한다.
-->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=df14390194d7de08cee14f4e5898fbd2&autoload=false"></script>
<script>
  function postToApp(payload) {
    var message = JSON.stringify(payload);
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(message);
    } else if (window.parent && window.parent !== window) {
      // 웹 버전 앱은 RN WebView가 아니라 <iframe>으로 이 페이지를 띄운다 — 그때는 부모 창으로 보낸다.
      window.parent.postMessage(message, '*');
    }
  }

  var params = new URLSearchParams(window.location.search);
  var isRouteMode = params.get('mode') === 'route';

  kakao.maps.load(function () {
    // 기본값: 서울시청. RN/웹이 SET_CENTER를 보내주면 바로 옮겨진다.
    var defaultCenter = new kakao.maps.LatLng(37.5665, 126.9780);

    var map = new kakao.maps.Map(document.getElementById('map'), {
      center: defaultCenter,
      level: 4,
    });

    var marker = null;
    var routePolylines = [];
    var routeMarkers = [];

    // 오르막/평지/내리막 판정 기준. RN 앱(CourseRouteMap.tsx)의 SLOPE_LEGEND 색상과 맞춰야 한다.
    var SLOPE_STEP_METERS = 20;
    var SLOPE_UP_PERCENT = 3;
    var SLOPE_DOWN_PERCENT = -3;
    var SLOPE_COLORS = { up: '#BA1A1A', flat: '#0D6434', down: '#2E86DE' };

    function haversineMeters(lat1, lng1, lat2, lng2) {
      var R = 6371000;
      var toRad = function (d) { return (d * Math.PI) / 180; };
      var dLat = toRad(lat2 - lat1);
      var dLng = toRad(lng2 - lng1);
      var a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // 원본 좌표는 너무 촘촘해서 그대로 경사를 재면 고도 데이터 노이즈에 휘둘리니,
    // stepMeters 간격으로 리샘플링한 뒤 그 구간들끼리 경사를 비교한다.
    function resampleWithElevation(coords, stepMeters) {
      if (coords.length === 0) return [];
      var samples = [coords[0]];
      var accumulated = 0;
      for (var i = 1; i < coords.length; i++) {
        var prev = coords[i - 1];
        var curr = coords[i];
        accumulated += haversineMeters(prev[1], prev[0], curr[1], curr[0]);
        if (accumulated >= stepMeters) {
          samples.push(curr);
          accumulated = 0;
        }
      }
      var last = coords[coords.length - 1];
      if (samples[samples.length - 1] !== last) samples.push(last);
      return samples;
    }

    function slopeBucket(prev, curr) {
      var dist = haversineMeters(prev[1], prev[0], curr[1], curr[0]);
      if (dist < 1) return 'flat';
      var elevDelta = (curr[2] || 0) - (prev[2] || 0);
      var grade = (elevDelta / dist) * 100;
      if (grade >= SLOPE_UP_PERCENT) return 'up';
      if (grade <= SLOPE_DOWN_PERCENT) return 'down';
      return 'flat';
    }

    if (!isRouteMode) {
      marker = new kakao.maps.Marker({
        position: defaultCenter,
        map: map,
        draggable: true,
      });

      function selectLocation(latLng) {
        marker.setPosition(latLng);
        postToApp({ type: 'LOCATION_SELECTED', lat: latLng.getLat(), lng: latLng.getLng() });
      }

      // 마커를 직접 드래그해서 위치를 옮길 수 있다.
      kakao.maps.event.addListener(marker, 'dragend', function () {
        var pos = marker.getPosition();
        postToApp({ type: 'LOCATION_SELECTED', lat: pos.getLat(), lng: pos.getLng() });
      });

      // 지도를 탭하면 그 자리로 마커가 이동한다.
      kakao.maps.event.addListener(map, 'click', function (mouseEvent) {
        selectLocation(mouseEvent.latLng);
      });
    }

    function drawRoute(coordinates) {
      routePolylines.forEach(function (p) { p.setMap(null); });
      routePolylines = [];
      routeMarkers.forEach(function (m) { m.setMap(null); });
      routeMarkers = [];

      if (!Array.isArray(coordinates) || coordinates.length === 0) return;

      // coordinates는 [lng, lat, elevation] 순서(GeoJSON 관례)로 온다 — 카카오맵은 (lat, lng) 순서를 쓴다.
      var samples = resampleWithElevation(coordinates, SLOPE_STEP_METERS);

      function flushSegment(points, bucket) {
        if (points.length < 2) return;
        var path = points.map(function (c) { return new kakao.maps.LatLng(c[1], c[0]); });
        var polyline = new kakao.maps.Polyline({
          path: path,
          strokeWeight: 3,
          strokeColor: SLOPE_COLORS[bucket] || SLOPE_COLORS.flat,
          strokeOpacity: 0.9,
          strokeStyle: 'solid',
        });
        polyline.setMap(map);
        routePolylines.push(polyline);
      }

      if (samples.length < 2) {
        flushSegment(samples, 'flat');
      } else {
        var currentBucket = slopeBucket(samples[0], samples[1]);
        var currentPoints = [samples[0]];
        for (var i = 1; i < samples.length; i++) {
          var bucket = slopeBucket(samples[i - 1], samples[i]);
          if (bucket !== currentBucket) {
            currentPoints.push(samples[i]); // 색이 바뀌는 지점을 공유해서 선이 끊어져 보이지 않게 한다
            flushSegment(currentPoints, currentBucket);
            currentPoints = [samples[i]];
            currentBucket = bucket;
          } else {
            currentPoints.push(samples[i]);
          }
        }
        flushSegment(currentPoints, currentBucket);
      }

      var startMarker = new kakao.maps.Marker({
        position: new kakao.maps.LatLng(coordinates[0][1], coordinates[0][0]),
        map: map,
      });
      routeMarkers.push(startMarker);

      var bounds = new kakao.maps.LatLngBounds();
      coordinates.forEach(function (c) { bounds.extend(new kakao.maps.LatLng(c[1], c[0])); });
      map.setBounds(bounds);
    }

    function handleMessageFromApp(event) {
      var data;
      try {
        data = JSON.parse(event.data);
      } catch (e) {
        return;
      }
      if (data.type === 'SET_CENTER' && typeof data.lat === 'number' && typeof data.lng === 'number') {
        var latLng = new kakao.maps.LatLng(data.lat, data.lng);
        map.setCenter(latLng);
        if (marker) marker.setPosition(latLng);
      } else if (data.type === 'DRAW_ROUTE') {
        drawRoute(data.coordinates);
      }
    }

    // iOS는 window로, Android는 document로 메시지를 쏜다 — 둘 다 등록해야 한다.
    window.addEventListener('message', handleMessageFromApp);
    document.addEventListener('message', handleMessageFromApp);

    postToApp({ type: 'READY' });
  });
</script>
</body>
</html>
