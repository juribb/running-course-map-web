<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>러닝 코스 추천 - 지도</title>
<style>
  html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
  /* 카카오맵 저작권 표기는 SDK가 자동으로 지도 안에 넣어준다 — 따로 지울 수 없고, 지우면 이용 약관 위반이다 */
</style>
</head>
<body>
<div id="map"></div>

<!--
  이 페이지는 두 가지 모드로 쓰인다 (URL의 ?mode= 쿼리로 구분):
  - 기본(모드 없음): 출발 지점 선택 — 지도를 탭하거나 마커를 드래그해서 위치를 고른다.
  - ?mode=route: 코스 상세 화면에서 추천받은 실제 경로를 보여주기만 한다 (마커 드래그/탭 없음).

  React Native 앱 또는 웹 페이지(iframe) <-> 이 페이지 통신 프로토콜:

  [RN/웹 -> 이 페이지] postMessage로 JSON 문자열 전달:
    {"type": "SET_CENTER", "lat": 37.5665, "lng": 126.9780}
    받으면 지도 중심과 마커 위치를 그 좌표로 옮긴다 (최초 GPS 위치 전달용, 기본 모드에서만 씀).
    {"type": "DRAW_ROUTE", "coordinates": [[lng, lat], [lng, lat], ...]}
    받으면 그 좌표들을 이어 실제 경로를 그리고, 전체가 보이도록 지도를 맞춘다 (route 모드에서 씀).

  [이 페이지 -> RN/웹] postMessage로 JSON 문자열 전달:
    {"type": "LOCATION_SELECTED", "lat": ..., "lng": ...}
    지도를 탭하거나 마커를 드래그해서 위치를 확정할 때마다 보낸다 (기본 모드에서만).
    {"type": "READY"}
    카카오맵 SDK 로딩이 끝나고 지도가 뜬 직후 한 번 보낸다
    (RN/웹이 이 신호를 받은 뒤에 SET_CENTER나 DRAW_ROUTE를 보내야 안전하다).

  RN WebView에서는 window.ReactNativeWebView.postMessage로 보내고,
  일반 브라우저 iframe(웹 버전 앱)에서는 window.parent.postMessage로 보낸다 — 둘 다 지원한다.
-->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=df14390194d7de08cee14f4e5898fbd2&autoload=false"></script>
<script>
  function postToApp(payload) {
    var message = JSON.stringify(payload);
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(message);
    } else if (window.parent && window.parent !== window) {
      // 웹 버전 앱은 RN WebView가 아니라 <iframe>으로 이 페이지를 띄운다 — 그때는 부모 창으로 보낸다.
      window.parent.postMessage(message, '*');
    }
  }

  var params = new URLSearchParams(window.location.search);
  var isRouteMode = params.get('mode') === 'route';

  kakao.maps.load(function () {
    // 기본값: 서울시청. RN/웹이 SET_CENTER를 보내주면 바로 옮겨진다.
    var defaultCenter = new kakao.maps.LatLng(37.5665, 126.9780);

    var map = new kakao.maps.Map(document.getElementById('map'), {
      center: defaultCenter,
      level: 4,
    });

    var marker = null;
    var routePolyline = null;
    var routeMarkers = [];

    if (!isRouteMode) {
      marker = new kakao.maps.Marker({
        position: defaultCenter,
        map: map,
        draggable: true,
      });

      function selectLocation(latLng) {
        marker.setPosition(latLng);
        postToApp({ type: 'LOCATION_SELECTED', lat: latLng.getLat(), lng: latLng.getLng() });
      }

      // 마커를 직접 드래그해서 위치를 옮길 수 있다.
      kakao.maps.event.addListener(marker, 'dragend', function () {
        var pos = marker.getPosition();
        postToApp({ type: 'LOCATION_SELECTED', lat: pos.getLat(), lng: pos.getLng() });
      });

      // 지도를 탭하면 그 자리로 마커가 이동한다.
      kakao.maps.event.addListener(map, 'click', function (mouseEvent) {
        selectLocation(mouseEvent.latLng);
      });
    }

    function drawRoute(coordinates) {
      if (routePolyline) routePolyline.setMap(null);
      routeMarkers.forEach(function (m) { m.setMap(null); });
      routeMarkers = [];

      if (!Array.isArray(coordinates) || coordinates.length === 0) return;

      // coordinates는 [lng, lat] 순서(GeoJSON 관례)로 온다 — 카카오맵은 (lat, lng) 순서를 쓴다.
      var path = coordinates.map(function (c) {
        return new kakao.maps.LatLng(c[1], c[0]);
      });

      routePolyline = new kakao.maps.Polyline({
        path: path,
        strokeWeight: 5,
        strokeColor: '#0D6434',
        strokeOpacity: 0.9,
        strokeStyle: 'solid',
      });
      routePolyline.setMap(map);

      var startMarker = new kakao.maps.Marker({ position: path[0], map: map });
      routeMarkers.push(startMarker);

      var bounds = new kakao.maps.LatLngBounds();
      path.forEach(function (p) { bounds.extend(p); });
      map.setBounds(bounds);
    }

    function handleMessageFromApp(event) {
      var data;
      try {
        data = JSON.parse(event.data);
      } catch (e) {
        return;
      }
      if (data.type === 'SET_CENTER' && typeof data.lat === 'number' && typeof data.lng === 'number') {
        var latLng = new kakao.maps.LatLng(data.lat, data.lng);
        map.setCenter(latLng);
        if (marker) marker.setPosition(latLng);
      } else if (data.type === 'DRAW_ROUTE') {
        drawRoute(data.coordinates);
      }
    }

    // iOS는 window로, Android는 document로 메시지를 쏜다 — 둘 다 등록해야 한다.
    window.addEventListener('message', handleMessageFromApp);
    document.addEventListener('message', handleMessageFromApp);

    postToApp({ type: 'READY' });
  });
</script>
</body>
</html>
